- hosts: servers
  become: yes
  tasks:
    - name: Install Java 17
      dnf:
        name: java-17-amazon-corretto
        state: present

    - name: Create app directory
      file:
        path: /opt/pulse
        state: directory

    - name: Copy Maven artifact to EC2
      copy:
        src: ../app/target/pulse-app-1.0.0.jar
        dest: /opt/pulse/pulse-app.jar

    - name: Stop existing java process if running
      shell: pkill -f java || true
      failed_when: false

    - name: Run Web App in background
      shell: nohup java -jar /opt/pulse/pulse-app.jar > /opt/pulse/app.log 2>&1 &
